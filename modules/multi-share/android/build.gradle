plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.multishare'
version = '0.1.0'

dependencies {
  implementation 'androidx.core:core:1.13.1'
}

android {
  namespace "expo.modules.multishare"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
